[package]
name = "tauri-app"
version = "2.2.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Windows: ladda onnxruntime.dll vid körning (inbäddad i exe:n) i stället för att länka
# ort:s färdiga /MD-bibliotek, som krockar med appens statiska CRT (/MT).
embedded-ort = ["ort/load-dynamic"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["rt"] }
hound = "3.5.1"
futures-util = "0.3.32"
tauri-plugin-dialog = "2"
sysinfo = "0.33.1"
symphonia = { version = "0.5", default-features = false, features = [
    "mp3", "aac", "isomp4", "wav", "ogg", "vorbis", "flac", "pcm", "adpcm"
] }
num_cpus = "1.16"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
ort = "=2.0.0-rc.12"
rustfft = "6.4"
regex = "1"
sha2 = "0.10"
# Talaridentifiering: pyannote community-1-pipelinen i ren Rust (CPU, ingen onnxruntime).
# Lokal patchad kopia (snabbare matrismultiplikation), se vendor/speakrs/TRANSKRIBERA-PATCH.md.
speakrs = { path = "vendor/speakrs", default-features = false, features = ["cpu"] }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.15.3"
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
] }

