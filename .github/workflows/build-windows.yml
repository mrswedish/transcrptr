name: Release Windows Build
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Long Paths
        run: |
          git config --system core.longpaths true
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -Force

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc


      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install Ninja
        run: choco install ninja

      - name: Install frontend dependencies
        run: npm install

      # Bygger src/app.css (Tailwind). tauri-action kör även beforeBuildCommand,
      # men vi gör det explicit här så bygget failar tydligt om CSS:en inte kan genereras.
      - name: Build CSS
        run: npm run build:css

      # onnxruntime.dll (Microsofts officiella CPU-build) bäddas in i exe:n.
      # ort:s färdiga statiska bibliotek är byggda med /MD och krockar med appens
      # statiska CRT (/MT), så ort laddar DLL:en dynamiskt (feature embedded-ort).
      - name: Hämta onnxruntime.dll
        shell: pwsh
        run: |
          $ver = "1.24.2"
          $sha = "8e3e9c826375352e29cb2614fe44f3d7a4b0ff7b8028ad7a456af9d949a7e8b0"
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v$ver/onnxruntime-win-x64-$ver.zip" -OutFile ort.zip
          if ((Get-FileHash ort.zip -Algorithm SHA256).Hash.ToLower() -ne $sha) { throw "Fel kontrollsumma för onnxruntime" }
          Expand-Archive ort.zip -DestinationPath ort-extract
          New-Item -ItemType Directory -Force src-tauri/embedded | Out-Null
          Copy-Item "ort-extract/onnxruntime-win-x64-$ver/lib/onnxruntime.dll" src-tauri/embedded/onnxruntime.dll
          (Get-Item src-tauri/embedded/onnxruntime.dll).Length

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMAKE_GENERATOR: Ninja
          CARGO_TARGET_DIR: D:\t
          RUSTFLAGS: -C target-feature=+crt-static
          CFLAGS: /MT
          CXXFLAGS: /MT
          CMAKE_POLICY_DEFAULT_CMP0091: NEW
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        with:
          tagName: transcrptr-v__VERSION__
          releaseName: 'Transkribera v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          # Bygge från annan gren än main blir en förhandsversion (inte "latest") så att den kan testas först.
          prerelease: ${{ github.ref_name != 'main' || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          includeRelease: true
          args: --features embedded-ort

      - name: Extract Project Version
        run: |
          $VERSION = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          echo "APP_VERSION=$VERSION" >> $env:GITHUB_ENV

      - name: Copy Portable Executable
        env:
          CARGO_TARGET_DIR: D:\t
        run: |
          $targetPath = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { "src-tauri/target" }
          $exePaths = @(
            "$targetPath/release/tauri-app.exe",
            "$targetPath/release/Transkribera.exe",
            "$targetPath/x86_64-pc-windows-msvc/release/tauri-app.exe",
            "$targetPath/x86_64-pc-windows-msvc/release/Transkribera.exe"
          )

          $found = $false
          foreach ($p in $exePaths) {
            if (Test-Path $p) {
              Copy-Item -Path $p -Destination "Transkribera-portable.exe"
              $found = $true
              break
            }
          }

          if (-not $found) {
            Get-ChildItem -Path src-tauri/target -Filter "*.exe" -Recurse | Select-Object FullName
            Write-Error "Could not find the executable."
          }

      - name: Copy NSIS Installer
        env:
          CARGO_TARGET_DIR: D:\t
        run: |
          $targetPath = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { "src-tauri/target" }
          $nsisPattern = "*-setup*.exe"
          $searchPaths = @(
            "$targetPath/release/bundle/nsis",
            "$targetPath/x86_64-pc-windows-msvc/release/bundle/nsis"
          )

          $found = $false
          foreach ($dir in $searchPaths) {
            if (Test-Path $dir) {
              $installer = Get-ChildItem -Path $dir -Filter $nsisPattern | Select-Object -First 1
              if ($installer) {
                Copy-Item -Path $installer.FullName -Destination "Transkribera_x64-setup.exe"
                Write-Host "Found NSIS installer: $($installer.FullName)"
                $found = $true
                break
              }
            }
          }

          if (-not $found) {
            Write-Warning "NSIS installer not found, only portable exe will be uploaded."
          }

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: transcrptr-v${{ env.APP_VERSION }}
          files: |
            Transkribera-portable.exe
            Transkribera_x64-setup.exe
          make_latest: ${{ github.ref_name == 'main' }}
          prerelease: ${{ github.ref_name != 'main' }}
